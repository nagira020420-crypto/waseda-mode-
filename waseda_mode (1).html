<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>WASEDA MODE</title>
<style>
:root{--bg:#111;--panel:#1b1b1b;--text:#f4f2ed;--muted:#aaa69c;--gold:#b59a57;--line:#37342d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;letter-spacing:.02em}button,input{font:inherit}button{cursor:pointer}.hero{min-height:260px;padding:25px 22px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(0deg,rgba(0,0,0,.94),rgba(0,0,0,.62)),linear-gradient(130deg,#565248,#171717 60%,#332e22);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(125deg,transparent 0 38px,#aaa 39px 40px,transparent 41px 78px)}.brand,.hero h1,.hero p,.date{position:relative;z-index:1}.brand{font-size:11px;letter-spacing:.25em;color:var(--gold);font-weight:700}.hero h1{font-size:clamp(28px,7vw,40px);line-height:1.35;margin:18px 0 10px}.hero p{margin:0;font-size:13px;color:#d4d0c7}.date{margin-top:22px;font-size:12px;color:#b8b3a8}main{max-width:760px;margin:auto;padding:18px 15px 45px}.quote{border-left:2px solid var(--gold);padding:9px 0 9px 14px;margin:2px 0 22px}.quote small{display:block;color:var(--gold);font-size:10px;letter-spacing:.16em;margin-bottom:7px}.quote strong{font-size:16px;line-height:1.7;font-weight:650}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.stat em{font-style:normal;color:var(--gold);font-size:12px}.progress{height:4px;background:#3a3831;border-radius:5px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:var(--gold);width:0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:23px 0 11px}.sectionhead h2{font-size:15px;margin:0}.sub{font-size:11px;color:var(--muted)}.row{display:flex;gap:8px}.field{width:100%;min-width:0;background:#101010;color:var(--text);border:1px solid #48443a;border-radius:8px;padding:11px;outline:none}.field:focus{border-color:var(--gold)}.btn{border:1px solid var(--gold);background:var(--gold);color:#171510;border-radius:8px;padding:10px 13px;font-weight:700;font-size:12px;white-space:nowrap}.btn.secondary{background:transparent;color:var(--text);border-color:#48443a}.btn.small{padding:6px 8px}.task{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #302e2a}.task:last-child{border-bottom:0}.task input{accent-color:var(--gold);width:19px;height:19px;margin:2px 0 0}.taskbody{flex:1;min-width:0}.taskname{font-size:14px;overflow-wrap:anywhere;line-height:1.5}.task.done .taskname{text-decoration:line-through;color:#777}.meta,.empty{font-size:11px;color:var(--muted);margin-top:5px}.empty{padding:14px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.logs{display:flex;flex-direction:column}.log{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #302e2a;padding:9px 0;font-size:13px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;height:130px;margin-top:16px}.daycol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}.barwrap{height:88px;width:100%;display:flex;align-items:flex-end;background:#292720;border-radius:4px;overflow:hidden}.bar{width:100%;background:var(--gold);min-height:2px}.daycol b,.daycol small{font-size:10px;color:var(--muted);font-weight:500}.foot{text-align:center;color:#777;font-size:10px;margin-top:28px}.goalrow{display:flex;align-items:center;gap:18px}.donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--gold) 0deg,#302e29 0deg);position:relative}.donut:before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--panel)}.donut strong{position:relative;font-size:22px}.goalcopy{font-size:12px;color:var(--muted);line-height:1.8}.taskweek{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:15px}.taskday{background:#24231f;border-radius:6px;padding:9px 3px;text-align:center}.taskday strong{display:block;font-size:14px;color:#eee}.taskday span{font-size:10px;color:var(--muted)}@media(min-width:650px){.hero{padding:34px max(calc((100% - 690px)/2),24px);min-height:300px}.hero h1{font-size:42px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}main{padding-top:24px}}
</style></head><body>
<header class="hero"><div class="brand">WASEDA MODE</div><h1>合格する人は、<br>今やってる。</h1><p>やるべきことから、逃げない。</p><div class="date" id="todayLabel"></div></header>
<main><section class="quote"><small>YOUR MODE</small><strong id="quoteText">合格する人は、今やってる。</strong></section>
<div class="stats"><div class="stat"><span>今日のToDo達成率</span><strong id="rate">0%</strong><div class="progress"><div id="rateBar"></div></div></div><div class="stat"><span>今日の勉強時間</span><strong><span id="studyTotal" style="display:inline;color:inherit;font-size:25px">0</span><em> 分</em></strong><span id="studyTargetText">目標：120分</span><div class="progress"><div id="studyBar"></div></div></div></div>
<section><div class="sectionhead"><h2>今日の目標達成度</h2><span class="sub">自分で決めた目標に対して</span></div><div class="card goalrow"><div class="donut" id="goalDonut"><strong id="goalPct">0%</strong></div><div class="goalcopy" id="goalCopy">目標を決めて、<br>今日の勉強を記録しよう。</div></div></section><div class="two"><section><div class="sectionhead"><h2>今日のToDo</h2><span class="sub" id="taskCount">0件</span></div><div class="card"><form id="taskForm" class="row"><input class="field" id="taskInput" placeholder="やることを追加" maxlength="120" required><button class="btn">追加</button></form><div id="taskList"></div><div class="sectionhead" style="margin-bottom:0"><span class="sub">毎日やること</span><label class="sub"><input type="checkbox" id="recurringToggle" style="accent-color:var(--gold)"> 毎日</label></div></div><div class="sectionhead"><h2>昨日の未完了</h2><span class="sub">必要なものだけ引き継ぐ</span></div><div class="card" id="carryList"></div></section>
<section><div class="sectionhead"><h2>勉強時間を記録</h2><span class="sub">手動入力</span></div><div class="card"><form id="studyForm" class="formgrid"><div class="full"><label class="label">科目・内容</label><input class="field" id="studySubject" placeholder="例：英語 文法" maxlength="100" required></div><div><label class="label">勉強時間（分）</label><input class="field" id="studyMinutes" type="number" min="1" max="1440" placeholder="30" required></div><div><label class="label">今日の目標（分）</label><input class="field" id="targetMinutes" type="number" min="1" max="1440" value="120" required></div><div class="full"><button class="btn" style="width:100%">記録する</button></div></form><div class="sectionhead"><h2>今日の記録</h2></div><div id="studyLogs" class="logs"></div></div></section></div>
<section><div class="sectionhead"><h2>今週の記録</h2><span class="sub">勉強時間 / 分</span></div><div class="card"><div id="weekChart" class="week"></div><div id="weekSummary" class="sub" style="margin-top:14px"></div></div></section><section><div class="sectionhead"><h2>今週のToDo達成率</h2><span class="sub">完了数 / 全タスク</span></div><div class="card"><div id="taskWeek" class="taskweek"></div><div id="taskWeekSummary" class="sub" style="margin-top:14px"></div></div></section><div class="foot">WASEDA MODE · 今日の一歩を、積み上げる。</div></main>
<script>
const $=id=>document.getElementById(id),key='waseda-mode-v1';
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shift=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let data={days:{},templates:[],target:120,logs:{}};try{data={...data,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(key,JSON.stringify(data));
function day(d=today()){return data.days[d]||(data.days[d]={tasks:[]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function init(){let d=today(),cur=day(d);if(!cur.initialized){cur.tasks=[...(data.templates||[]).map(t=>({id:uid(),text:t.text,done:false,recurring:true})),...cur.tasks];cur.initialized=true} $('todayLabel').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('targetMinutes').value=data.target||120;save()}
function tasks(){return day().tasks}function logs(){return data.logs[today()]||[]}
$('taskForm').onsubmit=e=>{e.preventDefault();let text=$('taskInput').value.trim();if(!text)return;let recurring=$('recurringToggle').checked;tasks().push({id:uid(),text,done:false,recurring});if(recurring&&!data.templates.some(t=>t.text===text))data.templates.push({text});$('taskInput').value='';$('recurringToggle').checked=false;save();render()};
$('studyForm').onsubmit=e=>{e.preventDefault();let subject=$('studySubject').value.trim(),mins=Number($('studyMinutes').value),target=Number($('targetMinutes').value);if(!subject||mins<1||target<1)return;data.target=target;(data.logs[today()]??=[]).push({id:uid(),subject,mins});$('studySubject').value='';$('studyMinutes').value='';save();render()};
function renderTasks(){let host=$('taskList');host.innerHTML='';let ts=tasks();$('taskCount').textContent=`${ts.filter(t=>t.done).length}/${ts.length}件`;if(!ts.length){host.innerHTML='<div class="empty">今日やることを、ひとつ決めよう。</div>';return}ts.forEach(t=>{let row=document.createElement('div');row.className='task'+(t.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save();render()};let body=document.createElement('div');body.className='taskbody';let name=document.createElement('div');name.className='taskname';name.textContent=t.text;body.append(name);if(t.recurring){let m=document.createElement('div');m.className='meta';m.textContent='毎日';body.append(m)}let del=document.createElement('button');del.className='btn secondary small';del.textContent='削除';del.onclick=()=>{if(t.recurring)data.templates=data.templates.filter(x=>x.text!==t.text);day().tasks=tasks().filter(x=>x.id!==t.id);save();render()};row.append(cb,body,del);host.append(row)})}
function renderCarry(){let host=$('carryList');host.innerHTML='';let prev=day(shift(today(),-1)).tasks.filter(t=>!t.done);if(!prev.length){host.innerHTML='<div class="empty">引き継ぐToDoはありません。</div>';return}prev.forEach(t=>{let row=document.createElement('div');row.className='task';let body=document.createElement('div');body.className='taskbody';body.textContent=t.text;let btn=document.createElement('button');btn.className='btn secondary small';btn.textContent='引き継ぐ';btn.onclick=()=>{if(!tasks().some(x=>x.text===t.text))tasks().push({id:uid(),text:t.text,done:false,recurring:false});save();render()};row.append(body,btn);host.append(row)})}
function renderLogs(){let host=$('studyLogs');host.innerHTML='';if(!logs().length){host.innerHTML='<div class="empty">勉強したら、ここに記録。</div>';return}logs().forEach(l=>{let row=document.createElement('div');row.className='log';let name=document.createElement('span');name.textContent=l.subject;let right=document.createElement('span');right.style.whiteSpace='nowrap';right.textContent=l.mins+'分 ';let del=document.createElement('button');del.className='btn secondary small';del.textContent='削除';del.onclick=()=>{data.logs[today()]=logs().filter(x=>x.id!==l.id);save();render()};right.append(del);row.append(name,right);host.append(row)})}
function renderWeek(){let dates=Array.from({length:7},(_,i)=>shift(today(),i-6)),totals=dates.map(d=>(data.logs[d]||[]).reduce((s,l)=>s+l.mins,0)),max=Math.max(60,...totals),host=$('weekChart');host.innerHTML='';dates.forEach((d,i)=>{let col=document.createElement('div');col.className='daycol';let wrap=document.createElement('div');wrap.className='barwrap';let bar=document.createElement('div');bar.className='bar';bar.style.height=Math.max(2,totals[i]/max*100)+'%';wrap.append(bar);let n=document.createElement('small');n.textContent=totals[i];let label=document.createElement('b');label.textContent=['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()];col.append(wrap,n,label);host.append(col)});$('weekSummary').textContent='7日間の勉強時間：'+totals.reduce((a,b)=>a+b,0)+'分'}
function renderTaskWeek(){let dates=Array.from({length:7},(_,i)=>shift(today(),i-6)),host=$('taskWeek'),all=0,done=0;host.innerHTML='';dates.forEach(d=>{let ts=(data.days[d]&&data.days[d].tasks)||[],dn=ts.filter(t=>t.done).length;all+=ts.length;done+=dn;let box=document.createElement('div');box.className='taskday';let strong=document.createElement('strong');strong.textContent=ts.length?Math.round(dn/ts.length*100)+'%':'—';let span=document.createElement('span');span.textContent=['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()];box.append(strong,span);host.append(box)});$('taskWeekSummary').textContent=all?`7日間の達成率：${Math.round(done/all*100)}%（${done}/${all}件）`:'まだ記録がありません。ToDoをこなすと、ここに積み上がる。'} 
let lastQuote='';function renderQuote(ts,total,target){let pool=ts.length&&ts.some(t=>!t.done)?['やるって決めたの、自分でしょ。','あとでやる、を何回繰り返す？','やるべきことは、わかってる。']:total<target?['その勉強量で、足りる？','受験日は、待ってくれない。','やっていない時間も、差になる。']:ts.length&&ts.every(t=>t.done)?['今日の分は、やり切った。','今日は、ちゃんと積み上げた。']:['合格する人は、今やってる。','やるべきことは、変わらない。','今日の一歩を、今日やる.'];pool=pool.filter(x=>x!==lastQuote);lastQuote=pool[Math.floor(Math.random()*pool.length)]||'合格する人は、今やってる。';$('quoteText').textContent=lastQuote}
function render(){renderTasks();renderCarry();renderLogs();let ts=tasks(),done=ts.filter(t=>t.done).length,rate=ts.length?Math.round(done/ts.length*100):0,total=logs().reduce((s,l)=>s+l.mins,0),target=data.target||120;$('rate').textContent=rate+'%';$('rateBar').style.width=rate+'%';$('studyTotal').textContent=total;$('studyTargetText').textContent='目標：'+target+'分';$('studyBar').style.width=Math.min(100,total/target*100)+'%';renderQuote(ts,total,target);let pct=Math.min(100,Math.round(total/target*100));$('goalPct').textContent=pct+'%';$('goalDonut').style.background=`conic-gradient(var(--gold) ${pct*3.6}deg,#302e29 0deg)`;$('goalCopy').innerHTML=total>=target?'目標達成。<br>今日の分は、やり切った。':`目標まであと <b style="color:var(--text)">${Math.max(0,target-total)}分</b><br>残りを、積み上げよう。`;renderWeek();renderTaskWeek()}
init();render();
</script></body></html>
